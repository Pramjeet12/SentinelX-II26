readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "dnslib>=0.9.26",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "openai>=2.26.0",
    "pillow>=12.1.1",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "reportlab>=4.4.10",
    "uvicorn>=0.41.0",
    "winotify>=1.1.0",
]
